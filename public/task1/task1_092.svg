  <text x="608.3" y="205" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">+29.1 yrs</text>
  <rect x="40" y="219" width="620" height="36" fill="#131c31" stroke="#1e293b" stroke-width="0.5"/>
  <text x="56.0" y="241" fill="#f8fafc" font-size="11.5" font-weight="600" text-anchor="start">Africa</text>
  <text x="195.0" y="241" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">40.2 yrs</text>
