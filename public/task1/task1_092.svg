  <text x="608.3" y="133" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">+12.2 yrs</text>
  <rect x="40" y="147" width="620" height="36" fill="#131c31" stroke="#1e293b" stroke-width="0.5"/>
