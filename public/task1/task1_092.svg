  <text x="608.3" y="169" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">+13.3 yrs</text>
  <rect x="40" y="183" width="620" height="36" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
  <text x="56.0" y="205" fill="#f8fafc" font-size="11.5" font-weight="600" text-anchor="start">Asia</text>
