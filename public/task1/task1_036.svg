  <text x="32" y="38" fill="#f8fafc" font-size="15" font-weight="700" letter-spacing="0.2">Automotive Powertrain Comparison (2024)</text>
  
  <rect x="40" y="75" width="620" height="36" rx="6" fill="#1e293b"/>
