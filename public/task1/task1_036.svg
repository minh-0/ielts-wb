  <text x="226.0" y="241" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">118 MPGe</text>
  <text x="350.0" y="241" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">0 g/km</text>
  <text x="474.0" y="241" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">$650</text>
  <text x="598.0" y="241" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">45</text>
</svg>