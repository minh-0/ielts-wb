  <rect x="40" y="183" width="620" height="36" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
  <text x="56.0" y="205" fill="#f8fafc" font-size="11.5" font-weight="600" text-anchor="start">Hybrid Electric</text>
  <text x="226.0" y="205" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">54 MPG</text>
  <text x="350.0" y="205" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">95 g/km</text>
  <text x="474.0" y="205" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">$1,200</text>
  <text x="598.0" y="205" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">85</text>
  <rect x="40" y="219" width="620" height="36" fill="#131c31" stroke="#1e293b" stroke-width="0.5"/>
