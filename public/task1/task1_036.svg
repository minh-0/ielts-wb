  <text x="598.0" y="97" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Maintenance Index</text>
  <rect x="40" y="111" width="620" height="36" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
  <text x="56.0" y="133" fill="#f8fafc" font-size="11.5" font-weight="600" text-anchor="start">Gasoline (Petrol)</text>
