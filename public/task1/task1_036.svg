  <text x="474.0" y="133" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">$2,100</text>
  <text x="598.0" y="133" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">100</text>
  <rect x="40" y="147" width="620" height="36" fill="#131c31" stroke="#1e293b" stroke-width="0.5"/>
  <text x="56.0" y="169" fill="#f8fafc" font-size="11.5" font-weight="600" text-anchor="start">Diesel</text>
  <text x="226.0" y="169" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">42 MPG</text>
  <text x="350.0" y="169" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">142 g/km</text>
