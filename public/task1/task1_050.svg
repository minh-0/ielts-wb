<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0b0f19;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <!-- Card Background -->
  <rect width="700" height="440" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Title Header -->
  <text x="32" y="38" fill="#f8fafc" font-size="15" font-weight="700" letter-spacing="0.2">Village of Stokeford Redevelopment (1930 vs 2010)</text>
  
  <rect x="35" y="70" width="300" height="330" rx="10" fill="#0a101f" stroke="#334155" stroke-width="1.5"/>
  <text x="185.0" y="95" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Stokeford in 1930 (Farmland)</text>
  <circle cx="305" cy="100" r="12" fill="#1e293b" stroke="#475569"/>
  <text x="305" y="104" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">N</text>
  <rect x="135" y="250" width="150" height="70" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="210.0" y="289.0" fill="#c7d2fe" font-size="9.5" font-weight="600" text-anchor="middle">Farmland Zone</text>
  <rect x="135" y="330" width="60" height="35" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="165.0" y="351.5" fill="#c7d2fe" font-size="9.5" font-weight="600" text-anchor="middle">Primary School</text>
  <rect x="215" y="330" width="60" height="35" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="245.0" y="351.5" fill="#c7d2fe" font-size="9.5" font-weight="600" text-anchor="middle">Village Shops</text>
  <rect x="365" y="70" width="300" height="330" rx="10" fill="#0a101f" stroke="#334155" stroke-width="1.5"/>
  <text x="515.0" y="95" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Stokeford in 2010 (Residential)</text>
  <circle cx="635" cy="100" r="12" fill="#1e293b" stroke="#475569"/>
  <text x="635" y="104" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">N</text>
  <rect x="805" y="250" width="150" height="70" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="880.0" y="289.0" fill="#c7d2fe" font-size="9.5" font-weight="600" text-anchor="middle">Housing Estates</text>
  <rect x="805" y="330" width="80" height="45" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="845.0" y="356.5" fill="#c7d2fe" font-size="9.5" font-weight="600" text-anchor="middle">Expanded School</text>
  <rect x="900" y="330" width="75" height="45" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="937.5" y="356.5" fill="#c7d2fe" font-size="9.5" font-weight="600" text-anchor="middle">Retirement Home</text>
</svg>