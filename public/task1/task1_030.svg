<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0b0f19;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <!-- Card Background -->
  <rect width="700" height="440" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Title Header -->
  <text x="32" y="38" fill="#f8fafc" font-size="15" font-weight="700" letter-spacing="0.2">Ashdown Museum Visitors and Satisfaction Ratings</text>
  
  <rect x="40" y="75" width="620" height="36" rx="6" fill="#1e293b"/>
  <text x="56.0" y="97" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="start">Metric</text>
  <text x="350.0" y="97" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Year Before Works</text>
  <text x="556.7" y="97" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Year After Works</text>
  <rect x="40" y="111" width="620" height="36" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
  <text x="56.0" y="133" fill="#f8fafc" font-size="11.5" font-weight="600" text-anchor="start">Total Annual Visitors</text>
  <text x="350.0" y="133" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">74,000</text>
  <text x="556.7" y="133" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">92,000</text>
  <rect x="40" y="147" width="620" height="36" fill="#131c31" stroke="#1e293b" stroke-width="0.5"/>
  <text x="56.0" y="169" fill="#f8fafc" font-size="11.5" font-weight="600" text-anchor="start">Very Satisfied</text>
  <text x="350.0" y="169" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">15%</text>
  <text x="556.7" y="169" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">35%</text>
  <rect x="40" y="183" width="620" height="36" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
  <text x="56.0" y="205" fill="#f8fafc" font-size="11.5" font-weight="600" text-anchor="start">Satisfied</text>
  <text x="350.0" y="205" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">30%</text>
  <text x="556.7" y="205" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">40%</text>
  <rect x="40" y="219" width="620" height="36" fill="#131c31" stroke="#1e293b" stroke-width="0.5"/>
  <text x="56.0" y="241" fill="#f8fafc" font-size="11.5" font-weight="600" text-anchor="start">Dissatisfied</text>
  <text x="350.0" y="241" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">40%</text>
  <text x="556.7" y="241" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">15%</text>
  <rect x="40" y="255" width="620" height="36" fill="#0f172a" stroke="#1e293b" stroke-width="0.5"/>
  <text x="56.0" y="277" fill="#f8fafc" font-size="11.5" font-weight="600" text-anchor="start">Very Dissatisfied</text>
  <text x="350.0" y="277" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">10%</text>
  <text x="556.7" y="277" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">5%</text>
  <rect x="40" y="291" width="620" height="36" fill="#131c31" stroke="#1e293b" stroke-width="0.5"/>
  <text x="56.0" y="313" fill="#f8fafc" font-size="11.5" font-weight="600" text-anchor="start">No Response</text>
  <text x="350.0" y="313" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">5%</text>
  <text x="556.7" y="313" fill="#cbd5e1" font-size="11.5" font-weight="400" text-anchor="middle">5%</text>
</svg>