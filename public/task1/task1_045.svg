<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0b0f19;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <!-- Card Background -->
  <rect width="700" height="440" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Title Header -->
  <text x="32" y="38" fill="#f8fafc" font-size="15" font-weight="700" letter-spacing="0.2">Plastic Bottle Recycling Sequence</text>
  
  <rect x="40.0" y="85" width="135" height="95" rx="10" fill="#131c31" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="40.0" y="85" width="135" height="24" rx="10" fill="#38bdf8" opacity="0.2"/>
  <text x="50.0" y="101" fill="#38bdf8" font-size="10" font-weight="700" font-family="monospace">Step 1</text>
  <text x="50.0" y="127" fill="#f8fafc" font-size="11.5" font-weight="700">1. Collection</text>
  <text x="50.0" y="145" fill="#94a3b8" font-size="9.5">Refuse trucks collect bins</text>
  <line x1="178.0" y1="132.5" x2="198.66666666666666" y2="132.5" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="201.66666666666666" y="85" width="135" height="95" rx="10" fill="#131c31" stroke="#34d399" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="201.66666666666666" y="85" width="135" height="24" rx="10" fill="#34d399" opacity="0.2"/>
  <text x="211.66666666666666" y="101" fill="#34d399" font-size="10" font-weight="700" font-family="monospace">Step 2</text>
  <text x="211.66666666666666" y="127" fill="#f8fafc" font-size="11.5" font-weight="700">2. Sorting &amp; Baling</text>
  <text x="211.66666666666666" y="145" fill="#94a3b8" font-size="9.5">Sorted &amp; compressed into</text>
  <text x="211.66666666666666" y="158" fill="#94a3b8" font-size="9.5">blocks</text>
  <line x1="339.66666666666663" y1="132.5" x2="360.3333333333333" y2="132.5" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="363.3333333333333" y="85" width="135" height="95" rx="10" fill="#131c31" stroke="#f472b6" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="363.3333333333333" y="85" width="135" height="24" rx="10" fill="#f472b6" opacity="0.2"/>
  <text x="373.3333333333333" y="101" fill="#f472b6" font-size="10" font-weight="700" font-family="monospace">Step 3</text>
  <text x="373.3333333333333" y="127" fill="#f8fafc" font-size="11.5" font-weight="700">3. Shredding Flakes</text>
  <text x="373.3333333333333" y="145" fill="#94a3b8" font-size="9.5">Crushed into micro flakes</text>
  <line x1="501.3333333333333" y1="132.5" x2="522.0" y2="132.5" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="525.0" y="85" width="135" height="95" rx="10" fill="#131c31" stroke="#fbbf24" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="525.0" y="85" width="135" height="24" rx="10" fill="#fbbf24" opacity="0.2"/>
  <text x="535.0" y="101" fill="#fbbf24" font-size="10" font-weight="700" font-family="monospace">Step 4</text>
  <text x="535.0" y="127" fill="#f8fafc" font-size="11.5" font-weight="700">4. Washing &amp; Melting</text>
  <text x="535.0" y="145" fill="#94a3b8" font-size="9.5">Decontaminated, melted to pellets</text>
  <line x1="592.5" y1="184" x2="592.5" y2="229" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40.0" y="250" width="135" height="95" rx="10" fill="#131c31" stroke="#a78bfa" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="40.0" y="250" width="135" height="24" rx="10" fill="#a78bfa" opacity="0.2"/>
  <text x="50.0" y="266" fill="#a78bfa" font-size="10" font-weight="700" font-family="monospace">Step 5</text>
  <text x="50.0" y="292" fill="#f8fafc" font-size="11.5" font-weight="700">5. New Products</text>
  <text x="50.0" y="310" fill="#94a3b8" font-size="9.5">Manufactured into bottles &amp;</text>
  <text x="50.0" y="323" fill="#94a3b8" font-size="9.5">textiles</text>
</svg>