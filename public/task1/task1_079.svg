  <text x="515.0" y="206.5" fill="#e2e8f0" font-size="9.5" font-weight="600" text-anchor="middle">Maintenance Road</text>
  <rect x="385" y="230" width="120" height="110" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1.2"/>
