  <rect x="525" y="230" width="120" height="110" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="585.0" y="289.0" fill="#c7d2fe" font-size="9.5" font-weight="600" text-anchor="middle">Battery Storage &amp; Grid</text>
