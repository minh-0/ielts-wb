  <rect x="195" y="115" width="120" height="60" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1.2"/>
  <text x="255.0" y="149.0" fill="#a7f3d0" font-size="9.5" font-weight="600" text-anchor="middle">Wheat Field East</text>
  <rect x="55" y="190" width="260" height="25" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.2"/>
