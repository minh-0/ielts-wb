  <rect x="195" y="230" width="120" height="110" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="255.0" y="289.0" fill="#c7d2fe" font-size="9.5" font-weight="600" text-anchor="middle">Farmhouse &amp; Barns</text>
  <rect x="365" y="70" width="300" height="330" rx="10" fill="#0a101f" stroke="#334155" stroke-width="1.5"/>
  <text x="515.0" y="95" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Present (Solar &amp; Eco Park)</text>
  <circle cx="635" cy="100" r="12" fill="#1e293b" stroke="#475569"/>
