<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0b0f19;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <!-- Card Background -->
  <rect width="700" height="440" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Title Header -->
  <text x="32" y="38" fill="#f8fafc" font-size="15" font-weight="700" letter-spacing="0.2">Chorleywood Village Expansion (1868 vs 1994)</text>
  
  <rect x="35" y="70" width="300" height="330" rx="10" fill="#0a101f" stroke="#334155" stroke-width="1.5"/>
  <text x="185.0" y="95" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Chorleywood 1868 (Small Village)</text>
  <circle cx="305" cy="100" r="12" fill="#1e293b" stroke="#475569"/>
  <text x="305" y="104" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">N</text>
  <rect x="215" y="270" width="70" height="50" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="250.0" y="299.0" fill="#c7d2fe" font-size="9.5" font-weight="600" text-anchor="middle">Small Village Core</text>
  <rect x="135" y="340" width="160" height="40" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="215.0" y="364.0" fill="#c7d2fe" font-size="9.5" font-weight="600" text-anchor="middle">Green Farmland</text>
  <rect x="365" y="70" width="300" height="330" rx="10" fill="#0a101f" stroke="#334155" stroke-width="1.5"/>
  <text x="515.0" y="95" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Chorleywood 1994 (Station &amp; Motorway)</text>
  <circle cx="635" cy="100" r="12" fill="#1e293b" stroke="#475569"/>
  <text x="635" y="104" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">N</text>
  <rect x="855" y="260" width="60" height="40" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="885.0" y="284.0" fill="#c7d2fe" font-size="9.5" font-weight="600" text-anchor="middle">Historic Core</text>
  <rect x="895" y="310" width="80" height="25" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="935.0" y="326.5" fill="#c7d2fe" font-size="9.5" font-weight="600" text-anchor="middle">Railway Station (1889)</text>
  <rect x="805" y="300" width="80" height="70" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="845.0" y="339.0" fill="#c7d2fe" font-size="9.5" font-weight="600" text-anchor="middle">Expanded Residential</text>
  <rect x="785" y="380" width="210" height="20" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="890.0" y="394.0" fill="#c7d2fe" font-size="9.5" font-weight="600" text-anchor="middle">M25 Motorway Link</text>
</svg>